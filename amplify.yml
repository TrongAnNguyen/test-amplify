version: 1
backend:
  phases:
    build:
      commands:
        - yarn install --frozen-lockfile
        - yarn add @parcel/watcher-linux-x64-glibc lightningcss-linux-x64-gnu @next/swc-linux-x64-gnu
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - yarn build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .yarn/**/*
      - node_modules/**/*
