version: 1
backend:
  phases:
    build:
      commands:
        - npm install --cache .npm --prefer-offline --legacy-peer-deps
        - npm install @parcel/watcher-linux-x64-glibc lightningcss-linux-x64-gnu @next/swc-linux-x64-gnu
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
